
name: Build Base Finder Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Extract source ZIP
        run: |
          mkdir -p project
          unzip -o base-finder-pro-starter.zip -d project

      - name: Verify project files
        run: |
          test -f project/settings.gradle
          test -f project/build.gradle
          test -f project/src/main/resources/fabric.mod.json

      - name: Build mod
        working-directory: project
        run: gradle build --stacktrace

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-finder-pro-build
          path: |
            project/build/libs/*.jar
          if-no-files-found: warn
